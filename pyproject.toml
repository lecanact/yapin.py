[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yapper.py"
version = "1.0.0"
authors = [
  { name="LeAndre C", email="leandre@lecanact.me" },
]
description = "An unofficial Python Library for Yapper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E*"]

[project.urls]
Repository = "https://github.com/our-websites/yapper.py"
Issues = "https://github.com/our-websites/yapper.py/issues"
Documentation = "https://yapper.website/developers"

[tool.setuptools.packages.find]
where = ["src"]
